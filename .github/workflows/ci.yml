name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -noEmit -skipLibCheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Artifact check
        run: npm run check:artifact
      - name: Reproducibility check
        run: npm run check:reproducible
      - name: Boundary check
        run: npm run check:boundary
      - name: Repository check
        run: npm run check:repo
      - name: Fixture check
        run: npm run check:fixtures
      - name: Comment check
        run: npm run check:comments
      - name: Text check
        run: npm run check:text
      - name: Commit check
        run: npm run check:commits
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --redact --log-opts=--all
      - name: Upload main.js
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main.js
          path: main.js
